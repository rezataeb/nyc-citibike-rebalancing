<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Citi Bike Rebalancing Explorer</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html, body { margin: 0; padding: 0; height: 100%; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #map { position: absolute; top: 0; bottom: 0; left: 0; right: 0; background: #f9f9f7; }

  #title, #legend, #status, #controls {
    position: absolute; z-index: 1000; background: rgba(252, 252, 251, 0.92);
    border-radius: 8px; box-shadow: 0 1px 4px rgba(11, 11, 11, 0.15); color: #0b0b0b;
  }
  #title { top: 16px; left: 24px; padding: 8px 14px; font-size: 14px; }
  #title .subtitle { color: #52514e; font-size: 12px; }
  #controls { top: 16px; left: 320px; padding: 8px 14px; font-size: 12px; display: flex; align-items: center; gap: 10px; }
  #controls label { color: #52514e; }
  #controls input[type="range"] { width: 200px; }
  #hour-label { font-weight: 600; min-width: 74px; display: inline-block; }
  #legend { bottom: 24px; left: 24px; padding: 12px 16px; font-size: 12px; }
  #legend .bar { width: 220px; height: 12px; border-radius: 6px; margin: 6px 0; }
  #legend .labels { display: flex; justify-content: space-between; font-size: 11px; color: #52514e; }
  #status { top: 16px; right: 24px; padding: 8px 14px; font-size: 12px; color: #52514e; }
</style>
</head>
<body>
<div id="map"></div>

<div id="title">
  <strong>Citi Bike Rebalancing Explorer</strong>
  <div class="subtitle" id="title-subtitle">Net flow at 8:00 AM, weekday (all-period average)</div>
</div>

<div id="controls">
  <label for="hour-slider">Hour of day</label>
  <input type="range" id="hour-slider" min="0" max="23" step="1" value="8">
  <span id="hour-label">8:00 AM</span>
</div>

<div id="legend">
  <div id="legend-title">Net flow at 8:00 AM weekday (bikes/day)</div>
  <div class="bar" id="legend-bar"></div>
  <div class="labels"><span>Deficit (no bikes)</span><span>0</span><span>Surplus (no docks)</span></div>
</div>

<div id="status">Loading stations&hellip;</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// Session 10 built the map skeleton (fixed 8am, no interactivity). Session 11
// adds interactions ONE AT A TIME, as separate commits -- this commit is the
// 24h time slider only. Still no weekday/weekend toggle, season/month
// selector, station detail panel, or equity/route/live-GBFS layers.

const DEFAULT_HOUR = 8; // initial slider position; no longer a fixed constant once wired up

// Fixed marker radius, not magnitude-scaled: with ~2,300 stations packed
// tightly in Manhattan, a size-encodes-magnitude scheme would make the
// densest, most decision-relevant area the most visually cluttered and
// hardest to click precisely. The diverging color scale below already
// carries magnitude (via how saturated/dark each marker is); adding size
// as a second magnitude channel is deferred, not needed here.
const MARKER_RADIUS_PX = 5;

// Diverging red<->gray<->blue, matching the palette already used in the
// Session 7.5 EDA report: red = draining (deficit, no bikes to pick up),
// blue = filling (surplus, no docks to return to), gray = near zero.
const DEFICIT_COLOR = [227, 73, 72];   // #e34948
const SURPLUS_COLOR = [42, 120, 214];  // #2a78d6
const NEUTRAL_COLOR = [137, 135, 129]; // #898781

function lerp(a, b, t) { return a + (b - a) * t; }

function lerpColor(c1, c2, t) {
  return `rgb(${Math.round(lerp(c1[0], c2[0], t))}, ${Math.round(lerp(c1[1], c2[1], t))}, ${Math.round(lerp(c1[2], c2[2], t))})`;
}

function divergingColor(value, domainMax) {
  const t = Math.max(-1, Math.min(1, value / domainMax));
  return t < 0 ? lerpColor(DEFICIT_COLOR, NEUTRAL_COLOR, t + 1) : lerpColor(NEUTRAL_COLOR, SURPLUS_COLOR, t);
}

function percentile(sortedArr, p) {
  const idx = (sortedArr.length - 1) * p;
  const lo = Math.floor(idx), hi = Math.ceil(idx);
  if (lo === hi) return sortedArr[lo];
  return lerp(sortedArr[lo], sortedArr[hi], idx - lo);
}

// Domain computed once across ALL 24 hours x all stations, not per-hour.
// Recomputing it per hour would make color intensity meaningless across
// the slider: a modest 3am imbalance and a severe 8am imbalance could both
// render fully saturated if each hour auto-normalized to its own range,
// defeating the point of a slider meant to show *when* imbalance peaks.
// Same 95th-percentile-of-|value| logic as Session 10, just over a bigger
// pool of values; floored at 0.5 to avoid a degenerate 0-width domain.
function computeDomainMax(stations, dayType) {
  const allAbs = [];
  for (const id in stations) {
    const curve = stations[id][dayType];
    for (let h = 0; h < 24; h++) allAbs.push(Math.abs(curve[h]));
  }
  allAbs.sort((a, b) => a - b);
  return Math.max(percentile(allAbs, 0.95), 0.5);
}

function formatHourLabel(hour) {
  const period = hour < 12 ? 'AM' : 'PM';
  let displayHour = hour % 12;
  if (displayHour === 0) displayHour = 12;
  return `${displayHour}:00 ${period}`;
}

// Dashboard state, kept in one place (rather than scattered closure
// variables) so the Node smoke test can inspect it via the test hook below.
const state = {
  stations: null,   // raw stations object from flows.json, once loaded
  markers: {},      // station_id -> Leaflet circleMarker, kept for in-place updates
  domainMax: null,
  currentHour: DEFAULT_HOUR,
};

// Recolors every existing marker for `hour` and updates the hour-dependent
// text (title subtitle, legend title, slider label). Does NOT touch the
// legend gradient bar or recompute domainMax -- both are fixed once, at
// load time, by design (see computeDomainMax's comment above).
function renderHour(hour) {
  state.currentHour = hour;
  for (const id in state.markers) {
    const value = state.stations[id].weekday[hour];
    state.markers[id].setStyle({ fillColor: divergingColor(value, state.domainMax) });
  }
  const label = formatHourLabel(hour);
  document.getElementById('title-subtitle').textContent = `Net flow at ${label}, weekday (all-period average)`;
  document.getElementById('legend-title').textContent = `Net flow at ${label} weekday (bikes/day)`;
  document.getElementById('hour-label').textContent = label;
}

function drawLegendGradient(domainMax) {
  const stops = [];
  for (let i = 0; i <= 10; i++) {
    const t = -1 + (2 * i) / 10;
    stops.push(`${divergingColor(t * domainMax, domainMax)} ${(i / 10) * 100}%`);
  }
  document.getElementById('legend-bar').style.background = `linear-gradient(to right, ${stops.join(', ')})`;
}

const map = L.map('map').setView([40.73, -73.95], 11); // NYC default, replaced by fitBounds once real station coords load

L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
  subdomains: 'abcd',
  maxZoom: 19,
}).addTo(map);

const ready = fetch('data/flows.json')
  .then(response => {
    if (!response.ok) throw new Error(`flows.json fetch failed: HTTP ${response.status}`);
    return response.json();
  })
  .then(payload => {
    state.stations = payload.stations;
    const ids = Object.keys(state.stations);

    // Bounding box derived from the real station coordinates in flows.json,
    // never hardcoded -- the map frames whatever data it was actually given.
    let bounds = null;
    for (const id of ids) {
      const latlng = [state.stations[id].lat, state.stations[id].lng];
      bounds = bounds ? bounds.extend(latlng) : L.latLngBounds([latlng, latlng]);
    }
    map.fitBounds(bounds, { padding: [20, 20] });

    state.domainMax = computeDomainMax(state.stations, 'weekday');

    for (const id of ids) {
      const s = state.stations[id];
      state.markers[id] = L.circleMarker([s.lat, s.lng], {
        radius: MARKER_RADIUS_PX,
        fillColor: divergingColor(s.weekday[state.currentHour], state.domainMax),
        color: '#ffffff',
        weight: 0.75,
        fillOpacity: 0.85,
      }).addTo(map);
    }

    drawLegendGradient(state.domainMax);
    renderHour(state.currentHour); // sets initial title/legend/slider text consistently with the markers just drawn

    document.getElementById('status').textContent = `${ids.length.toLocaleString()} stations`;

    // Slider updates are throttled to one render per animation frame rather
    // than one per 'input' event: dragging can fire far more events than
    // the browser can usefully restyle 2,347 markers for, so rapid events
    // are coalesced and only the latest value is ever rendered.
    const slider = document.getElementById('hour-slider');
    let pendingHour = null;
    let rafScheduled = false;
    slider.addEventListener('input', event => {
      pendingHour = Number(event.target.value);
      if (!rafScheduled) {
        rafScheduled = true;
        requestAnimationFrame(() => {
          renderHour(pendingHour);
          rafScheduled = false;
        });
      }
    });
  })
  .catch(error => {
    const status = document.getElementById('status');
    status.textContent = `Failed to load data/flows.json: ${error.message}`;
    status.style.color = '#e34948';
    console.error(error);
  });

// Test hook for the Node smoke test (tests/dashboard.test.js) -- an extra
// harmless global in a real browser, never read outside the test.
if (typeof globalThis !== 'undefined') {
  globalThis.__dashboard = {
    divergingColor, percentile, computeDomainMax, formatHourLabel, renderHour,
    getState: () => state,
    ready,
  };
}
</script>
</body>
</html>
