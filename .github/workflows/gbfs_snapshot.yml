# Session 71: cron changed from */10 (every 10 min) to hourly. This is not
# a cut in real data collection -- gh run list's own real run timestamps
# showed GitHub was already delivering roughly hourly runs on this
# schedule (matches pipeline/reliability.py's own docstring, which
# independently documented "~hourly... not the 10-minute cadence" as an
# observed fact). Declaring the schedule honestly just stops queuing
# attempts that were never actually going to fire on time.
#
# Also: this workflow used to commit+push a single ever-growing
# snapshots.csv, which crossed GitHub's 100MB per-file push limit around
# 2026-08-30 -- every run since had fetched real data, committed it
# locally, and then had that commit rejected on push (GH001: Large files
# detected), silently losing every snapshot since. pipeline/gbfs_logger.py
# now writes one file per UTC day instead (see current_log_path()), so
# the git-add target below is a glob over those dated files, never the
# frozen legacy snapshots.csv.
#
# Snapshot commits go to the `data-snapshots` branch, not master: ~1,100 of
# master's first ~1,200 commits were this job, which buried the project's
# own history. Code is checked out from master; the dated logs are checked
# out from data-snapshots into snap/, copied alongside the logger so it
# appends to today's file, then copied back and pushed there.
name: GBFS snapshot

"on":
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: gbfs-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: data-snapshots
          path: snap

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - run: |
          mkdir -p data/gbfs_log
          cp snap/data/gbfs_log/snapshots_*.csv data/gbfs_log/

      - run: python -m pipeline.gbfs_logger

      - run: |
          cp data/gbfs_log/snapshots_*.csv snap/data/gbfs_log/
          cd snap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/gbfs_log/snapshots_*.csv
          git diff --staged --quiet || git commit -m "Log GBFS snapshot"
          git push origin data-snapshots
